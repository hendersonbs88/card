<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Brandon Henderson – TK Holdings</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px 0 40px;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  .card {
    background: #1a1a1a;
    width: 360px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  .logo-section {
    background: #1a1a1a;
    padding: 28px 24px 0;
    display: flex;
    justify-content: center;
  }
  .logo-box {
    background: #fff;
    border-radius: 10px;
    padding: 14px 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .logo-box img {
    width: 200px;
    height: auto;
    display: block;
  }
  .orange-rule {
    margin: 22px 28px 0;
    border: none;
    border-top: 2px solid #F5A623;
  }
  .name-section {
    padding: 18px 24px 0;
    text-align: center;
  }
  .name {
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.2px;
    line-height: 1.2;
  }
  .title-en {
    color: #F5A623;
    font-size: 14px;
    font-weight: 600;
    margin-top: 6px;
    line-height: 1.3;
  }
  .title-cn {
    color: #aaa;
    font-size: 12px;
    margin-top: 4px;
  }
  .gray-rule {
    margin: 18px 28px 0;
    border: none;
    border-top: 1px solid #333;
  }
  .contact-section {
    padding: 14px 36px 0;
  }
  .contact-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 10px;
  }
  .contact-label {
    color: #F5A623;
    font-size: 13px;
    font-weight: 700;
    width: 18px;
    flex-shrink: 0;
  }
  .contact-value {
    color: #e0e0e0;
    font-size: 13px;
    text-decoration: none;
  }
  .contact-value:hover { color: #fff; }
  .linkedin-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .linkedin-icon {
    width: 22px;
    height: 22px;
    background: #0077B5;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .linkedin-icon svg { width: 14px; height: 14px; fill: #fff; }
  .linkedin-link {
    color: #4BA3D3;
    font-size: 13px;
    text-decoration: none;
    font-weight: 500;
  }
  .linkedin-link:hover { color: #6dc0f0; }
  .tagline-section {
    margin: 4px 28px 0;
    text-align: center;
    padding: 14px 0;
  }
  .tagline {
    color: #888;
    font-size: 11px;
    font-style: italic;
    line-height: 1.5;
  }
  .save-section {
    padding: 0 24px 28px;
    text-align: center;
  }
  .save-btn {
    display: block;
    background: #F5A623;
    color: #1a1a1a;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    padding: 14px 20px;
    border-radius: 10px;
    text-decoration: none;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .save-btn:active { background: #d4891a; }
</style>
</head>
